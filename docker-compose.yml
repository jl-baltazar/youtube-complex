services:
  plex:
    # Official Plex Media Server image
    image: plexinc/pms-docker:latest
    container_name: plex
    restart: unless-stopped

    # macOS Docker does not fully support host networking; use explicit port mappings instead.
    ports:
      - "32400:32400/tcp"  # Web UI & API
      - "32400:32400/udp"  # GDM network discovery
      - "32469:32469/tcp"  # DLNA server
      - "32410:32410/udp"  # GDM network discovery
      - "32412:32412/udp"  # GDM network discovery
      - "32413:32413/udp"  # GDM network discovery
      - "32414:32414/udp"  # GDM network discovery

    volumes:
      # Persistent Plex server configuration
      - ./plex/config:/config
      # Transcoding cache (can grow large)
      - ./plex/transcode:/transcode
      # Shared media volume (must match ingestion side)
      - /Users/jlgarcia/Movies:/media

    environment:
      # Adjust timezone as desired
      - TZ=${TZ:-America/Los_Angeles}
      # Match host user's UID/GID for seamless permissions
      - PLEX_UID=501
      - PLEX_GID=20
      - PLEX_CLAIM=claim-767bSB11cnHsNwv64CCN
      - ADVERTISE_IP=http://${HOST_IP:-127.0.0.1}:32400

# yt-dlp config for playlist downloads
# Key differences from yt-dlp.conf:
#   - No --playlist-end or --max-downloads (download ALL videos)
#   - Episode numbering by playlist position (S01Exxx), not upload date
#   - Output goes to ~/Movies/youtube-playlists/

# Output directory — passed dynamically by download-playlists.sh via --output flag

# Download archive — passed explicitly via --download-archive by the wrapper script

# Video format (H.264 preferred — AV1/VP9 won't play on most TVs)
-f "bestvideo[vcodec^=avc1][ext=mp4]+bestaudio[ext=m4a]/bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best"

# Embed metadata and thumbnail
--write-info-json
--write-thumbnail
--convert-thumbnails jpg
--embed-thumbnail
--embed-metadata

# Logging is handled by wrapper script (tee)
--verbose

# No overwrites; archive already prevents dups but keep extra guard
--no-overwrites

# Limit concurrent downloads
--concurrent-fragments 1

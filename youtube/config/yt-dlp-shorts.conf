# yt-dlp config para SHORTS
# Diferencias clave vs yt-dlp.conf / yt-dlp-playlist.conf:
#   - Filtro de duracion: solo shorts (<=180s)
#   - El --output, --playlist-end, --max-downloads y las cookies los pasa
#     download-shorts.sh por fuente (canal / likes / history / random).

# Formato de video (H.264 de preferencia — AV1/VP9 no corren en muchas TVs)
-f "bestvideo[vcodec^=avc1][ext=mp4]+bestaudio[ext=m4a]/bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best"

# PO Token: usa el contenedor bgutil (pot-provider). Sin esto → "Sign in to confirm
# you're not a bot". Necesario sobre todo para la fuente random (sin cookies).
--extractor-args "youtubepot-bgutilhttp:base_url=http://pot-provider:4416"

# Solo SHORTS reales: ademas de duracion corta, VERTICAL (aspect_ratio<1). El filtro
# de duracion solo no basta (deja pasar videos horizontales cortos); YouTube Shorts
# son verticales. ytsearch devuelve URLs /watch (no /shorts), asi que el aspecto
# vertical es la senal confiable. Los canales /@x/shorts ya son verticales de por si.
--match-filter "duration<=180 & aspect_ratio<1 & !is_live & !was_live"

# Tope de tamano: un short real es chico; esto evita bajar videos cortos pero en 4K
# (timelapses etc.) que pesan cientos de MB.
--max-filesize 150M

# Metadata y thumbnail
--write-info-json
--write-thumbnail
--convert-thumbnails jpg
--embed-thumbnail
--embed-metadata

--verbose

# FAT32/exFAT (TOSHIBA SSD) no soporta : ? * < > | " \ en nombres
--windows-filenames

# Quita espacios finales del uploader (el filesystem los rechaza)
--replace-in-metadata "uploader" "\s+$" ""

--no-overwrites
--concurrent-fragments 1

# Las fuentes son playlists/busquedas: NO escribas info.json/thumbnail a nivel
# playlist (si no, ensucia la carpeta Shorts con un metafile por cada busqueda/feed).
--no-write-playlist-metafiles

# Fail fast
--socket-timeout 30
--retries 3
--extractor-retries 1
--fragment-retries 3

# Output directory — passed dynamically by download.sh via --output flag

# Download archive — passed explicitly via --download-archive by the wrapper script

# Video format (H.264 preferred — AV1/VP9 won't play on most TVs)
-f "bestvideo[vcodec^=avc1][ext=mp4]+bestaudio[ext=m4a]/bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best"

# PO Token: usa el contenedor bgutil (pot-provider) para generar los tokens que
# YouTube exige. Sin esto → "Sign in to confirm you're not a bot".
--extractor-args "youtubepot-bgutilhttp:base_url=http://pot-provider:4416"

# Embed metadata and thumbnail
--write-info-json
--write-thumbnail
--convert-thumbnails jpg
--embed-thumbnail
--embed-metadata

# When cookies.txt exists and is valid the wrapper script adds --cookies <file>

# Logging is handled by wrapper script (tee)
--verbose

# ---- Latest-only logic ----
--playlist-end 2        # only check the 2 most recent videos per channel
--max-downloads 1       # stop after first video that passes archive check

# Strip trailing spaces from uploader name (NAS filesystem rejects them)
--replace-in-metadata "uploader" "\s+$" ""

# No overwrites; archive already prevents dups but keep extra guard
--no-overwrites

# Limit concurrent downloads
--concurrent-fragments 1

# Skip livestreams — they never finish and block the entire cycle
--match-filter "!is_live & !was_live"

# Fail fast — defaults (10/10/3) can keep a single failing channel busy for 30+ min
--socket-timeout 30
--retries 3
--extractor-retries 1
--fragment-retries 3
